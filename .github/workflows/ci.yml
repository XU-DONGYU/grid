name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy app.py grid_analyzer scripts

      - name: Tests
        run: pytest --cov=app --cov=grid_analyzer --cov-report=term-missing

      - name: Secret scan
        run: python scripts/scan_secrets.py

      - name: Product docs
        run: python scripts/check_product_docs.py

      - name: Frontend syntax
        run: |
          for file in grid_analyzer/web/static/js/*.js; do
            node --check "$file"
          done
